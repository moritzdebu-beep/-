    <main>
      <header class="student-category-heading">

          <span>学生作业<span class="student-category-heading__comma">，</span>所有作业均结合<span class="student-category-heading__cap" aria-hidden="true"><img src="./assets/emoji/student-pixel-graduation-cap.png" alt="" width="736" height="736" /></span></span>

        <p class="student-category-heading__english" lang="en">Display</p>
      </header>

      <section class="student-work-grid" aria-label="Student homework gallery"></section>

      <section class="student-motion-section" id="student-motion" aria-labelledby="student-motion-title">

          <h2 id="student-motion-title" data-pixel-initials="off"><span data-editable data-edit-key="student-motion-title">学生作品<span class="student-motion-heading__comma">，</span>AIGC动态作业</span><img class="student-motion-heading__trophy" src="./assets/emoji/student-pixel-trophy.svg" alt="" aria-hidden="true" width="68" height="68" /></h2>

          <div class="studio-footer__entry">
            <p class="studio-footer__label">业务咨询</p>
            <p class="studio-footer__phone"><span class="studio-footer__value">13155802318</span><span>（黄先生）</span></p>
          </div>
          <div class="studio-footer__entry">
            <p class="studio-footer__label">课程咨询</p>
            <p><span class="studio-footer__value">ciwei8172</span></p>
          </div>
          <div class="studio-footer__entry">

          </div>
        </div>
      </div>
    </footer>

    <div class="student-lightbox" role="dialog" aria-modal="true" aria-label="作业大图预览" hidden>
      <button class="student-lightbox__close" type="button" aria-label="关闭大图">×</button>
      <button class="student-lightbox__arrow student-lightbox__arrow--previous" type="button" aria-label="上一张"></button>
      <figure class="student-lightbox__figure">
        <img class="student-lightbox__image" src="" alt="" />
        <figcaption class="student-lightbox__caption"></figcaption>
      </figure>
      <button class="student-lightbox__arrow student-lightbox__arrow--next" type="button" aria-label="下一张"></button>
    </div>

    <dialog class="student-video-dialog" aria-label="学生动态作品观看">
      <div class="student-video-viewer">
        <button class="student-video-dialog__close" type="button" aria-label="退出观看" autofocus>×</button>
        <a class="student-video-viewer__arrow student-video-viewer__arrow--previous" aria-label="上一部作品"></a>
        <figure class="student-video-viewer__figure">
